<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Font Awesome Link for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        /* Button Style with Loading Space */
        button { width: 100%; padding: 12px; background-color: #007BFF; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        
        /* Hide element class */
        .hidden { display: none !important; }
        
        /* Success Card Visuals */
        .success-icon { font-size: 50px; color: #28a745; margin-bottom: 15px; animation: scaleUp 0.3s ease-in-out; }
        @keyframes scaleUp {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. THE RESET FORM -->
    <div id="formContainer" class="card">
        <h2>Reset Your Password</h2>
        <p>Enter your details to receive your reset information.</p>
        
        <!-- Action prevents page reload for this demo -->
        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="input-group">
                <label for="email">Email ID</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="Enter phone number">
            </div>
            
            <!-- Button with 'Paper Plane' Icon -->
            <button type="submit" id="submitBtn">
                <span id="btnText">Send Password</span>
                <i id="btnIcon" class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- 2. THE SUCCESS SCREEN (Hidden by default) -->
    <div id="successContainer" class="card hidden">
        <!-- Checkmark Icon indicating password is reset -->
        <div class="success-icon">
            <i class="fas fa-circle-check"></i>
        </div>
        <h2>Password Reset!</h2>
        <p>A secure recovery link has been generated and sent to your devices successfully.</p>
        <button onclick="window.location.href='useanother.html';">Back to Login</button>
    </div>

    <!-- JavaScript to control the Icons and Screens -->
    <script>
        function handleReset(event) {
            event.preventDefault(); // Stops page from reloading instantly
            
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const submitBtn = document.getElementById('submitBtn');
            
            // Step 1: Turn icon into a loading spinner when clicked
            btnText.innerText = "Sending...";
            btnIcon.className = "fas fa-spinner fa-spin"; 
            submitBtn.disabled = true; // Prevents double-clicking
            
            // Step 2: Simulate a 2-second backend network delay
            setTimeout(() => {
                // Hide the input form card
                document.getElementById('formContainer').classList.add('hidden');
                
                // Show the success card with the "Reset Confirmed" checkmark icon
                document.getElementById('successContainer').classList.remove('hidden');
            }, 2000); 
        }
    </script>

</body>
</html>
