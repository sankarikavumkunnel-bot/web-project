<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #ffffff;
            color: #1f1f1f;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 448px;
            margin-top: 20px;
        }

        .google-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #3c4043;
            margin-bottom: 40px;
        }

        .google-logo svg {
            width: 24px;
            height: 24px;
        }

        h1 {
            font-size: 36px;
            font-weight: 400;
            line-height: 44px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: #1f1f1f;
            margin-bottom: 40px;
        }

        .subtitle a {
            color: #0b57d0;
            text-decoration: none;
            font-weight: 500;
        }

        .subtitle a:hover {
            text-decoration: underline;
        }
        /* Wrap content area to fade out nicely during loading */
        .content-fade {
            transition: opacity 0.2s ease-in-out;
        }

        .content-fade.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .account-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            width:100%;
            border-bottom: 1px solid #e3e3e3;
            margin-bottom: 20px;
        }
        .google-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #3c4043;
            margin-bottom: 40px;
        }

        .google-header svg {
            width: 24px;
            height: 24px;
        }

.account-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 4px;
            background: none;
            border: none;
            border-top: 1px solid #e3e3e3;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        /* Hover Feedback */
        .account-btn:hover {
            background-color: #f8f9fa;
        }

        /* Active Click Feedback */
        .account-btn:active {
            background-color: #f1f3f4;
        }

        /* Focus Ring for Accessibility */
        .account-btn:focus-visible {
            outline: 2px solid #0b57d0;
            outline-offset: -2px;
        }


        /*.account-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-top: 1px solid #e3e3e3;
            cursor: pointer;
        }
        */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: 500;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar.purple {
            background-color: #673ab7;
        }

        .account-info {
            display: flex;
            flex-direction: column;
        }

        .account-name {
            font-size: 16px;
            font-weight: 500;
            color: #1f1f1f;
            line-height: 24px;
        }

        .account-email {
            font-size: 14px;
            color: #5e5e5e;
            line-height: 20px;
        }

        .use-another {
            display: flex;
            align-items: center;
            padding: 16px 0;
            cursor: pointer;
            color: #1f1f1f;
            font-size: 16px;
            font-weight: 500;
        }

        .use-another-icon {
            width: 40px;
            height: 40px;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0b57d0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: auto;
            width: 100%;
            max-width: 448px;
            padding: 20px 0;
            display: flex;
            justify-content: flex-start;
        }
        .language-dropdown {
            font-size: 12px;
            color: #5e5e5e;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 4px 16px 4px 0;
            appearance: none; /* Hide default native browser arrow */
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='8' height='8' viewBox='0 0 24 24' fill='%235e5e5e'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right center;
        }

        .language-dropdown:focus-visible {
            outline: 1px solid #0b57d0;
            border-radius: 2px;
        }
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: #ffffff;
            width: 90%;
            max-width: 340px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .modal-backdrop.show .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #1f1f1f;
        }

        .modal-body {
            font-size: 14px;
            color: #5e5e5e;
            line-height: 20px;
            margin-bottom: 24px;
        }

        .modal-field {
            margin-bottom: 12px;
        }

        .modal-label {
            font-weight: 500;
            color: #1f1f1f;
            display: block;
            margin-bottom: 2px;
        }

        /* Got It Button Styling */
        .modal-btn {
            display: block;
            margin-left: auto;
            background-color: #0b57d0;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .modal-btn:hover { background-color: #0a4ebd; }
        .modal-btn:active { background-color: #0842a0; }

       /* .language-selector {
            font-size: 12px;
            color: #5e5e5e;
            cursor: pointer;
            display: flex;

            gap: 4px;
        }
       
        .language-selector::after {
            content: "▼";
            font-size: 8px;

       /* Inline Link Style */
.subtitle-link {
  color: #007bff;
  text-decoration: underline;
  font-weight: bold;
  cursor: pointer;
}
.subtitle-link:hover {
  color: #0056b3;
}

/* Modal Popup Background Overlay */
.custom-modal {
  display: none; 
  position: fixed; 
  z-index: 9999; 
  left: 0;
  top: 0;
  width: 100%; 
  height: 100%; 
  background-color: rgba(0, 0, 0, 0.5); 
}

/* Small Information Box Layout */
.modal-content {
  background-color: #ffffff;
  margin: 15% auto; 
  padding: 25px 20px;
  border-radius: 8px;
  width: 300px; 
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  position: relative;
  text-align: center;
  font-family: Arial, sans-serif;
  color: #333;
}

.modal-content h3 {
  margin-top: 5px;
  font-size: 18px;
  color: #111;
}

.modal-content p {
  font-size: 14px;
  margin: 8px 0;
}

/* Close Button (X) */
.close-btn {
  position: absolute;
  right: 15px;
  top: 10px;
  font-size: 22px;
  cursor: pointer;
  color: #aaa;
}
.close-btn:hover {
  color: #000;
}

/* Highlighted Footer Area & Button */
.modal-footer {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid #eee;
}

.footer-action-btn {
  background-color: #007bff;
  color: white;
  border: none;
  padding: 10px;
  font-size: 14px;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  font-weight: bold;
}
.footer-action-btn:hover {
  background-color: #0056b3;
}
  
    </style>
</head>

    <script>
        function handleAccountSelect(user) {
            // 1. Hide the active text menu elements
            document.getElementById('form-content').classList.add('hidden');
            
            // 2. Display the Google loading spinner animation
            document.getElementById('loading-screen').style.display = 'block';

            // 3. Wait 1 second (simulating real Google account checking) then load next page
            setTimeout(() => {
                window.location.href = "password_page.html?user=" + user;
            }, 1000);
        }
    </script>
   

<script>
  const modal = document.getElementById("infoModal");
  const trigger = document.getElementById("ieee-trigger");
  const closeBtn = document.querySelector(".close-btn");
  const gotItBtn = document.getElementById("got-it-btn");

  // Open the box
  trigger.addEventListener("click", (e) => {
    e.preventDefault(); 
    modal.style.display = "block";
  });

  // Close the box
  const closeModal = () => {
    modal.style.display = "none";
  };

  closeBtn.addEventListener("click", closeModal);
  gotItBtn.addEventListener("click", closeModal);

  // Close if clicking outside the box
  window.addEventListener("click", (event) => {
    if (event.target === modal) {
      closeModal();
    }
  });
</script>
<script>
function handleLogin(email) {
    // 1. Save the chosen email to show on the next page
    localStorage.setItem("selectedEmail", email);

    // 2. Check if the email ends with the allowed organization domain
    if (email.endsWith("@sahrdaya.ac.in")) {
        // If it is the correct institutional email, go to the successful home page
        window.location.href = "dashboard.html"; 
    } else {
        // If it is a personal gmail account, redirect to your blocked error page
        window.location.href = "account.html";
    }
}
</script>
