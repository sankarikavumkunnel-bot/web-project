<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Modal</title>
    <!-- Google Fonts for pixelated header and clean UI font -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Modal Card Container */
        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            text-align: center;
            overflow: hidden;
        }

        /* Top Accent Graphic */
        .top-graphic {
            position: absolute;
            top: 0;
            left: 25px;
            width: 50px;
            height: 60px;
            background-color: #0066cc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 10px;
        }
        .pixel-face {
            width: 30px;
            height: 30px;
            background: #f1c40f;
            border: 3px solid #34495e;
            position: relative;
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 22px;
            color: #94a3b8;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* Header Elements */
        .modal-header {
            font-family: 'Press Start 2P', cursive;
            font-size: 22px;
            color: #0f172a;
            margin-top: 60px;
            letter-spacing: 2px;
        }
        .header-line {
            width: 50px;
            height: 3px;
            background-color: #0066cc;
            margin: 12px auto 25px auto;
        }
        .modal-description {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        /* Action Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }
        .btn-google {
            background-color: #09090b;
            color: #ffffff;
            border: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .btn-google:hover {
            background-color: #27272a;
        }
        .btn-google:active{
            background-color:#e0e0e0;
        }
        .btn-passkey {
            background-color: #ffffff;
            color: #0f172a;
            border: 1px solid #e2e8f0;
            transition:background-color 0.2s,transform 0.1s;
        }
        .btn-passkey:hover {
            background-color: #f8fafc;
        }
        .btn-passkey:active{
            background-color:#e0e0e0;
            transform:scale(0.98);
        }

        /* Footer Branding */
        .footer-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            letter-spacing: 3px;
            margin: 30px 0 15px 0;
        }
        .footer-divider::before, .footer-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        .footer-divider:not(:empty)::before { margin-right: 15px; }
        .footer-divider:not(:empty)::after { margin-left: 15px; }

        .footer-note {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .navbar {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: 70px;
    background: white;
    border-radius: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    z-index: 1000;
}

.navbar a {
    text-decoration: none;
    color: #666;
    font-weight: 600;
    font-size: 16px;
    transition: 0.3s ease;
    padding: 10px 18px;
    border-radius: 20px;
}

.navbar a:hover {
    background: #0077b6;
    color: white;
    transform: translateY(-2px);
}

.navbar a.active {
    background: #0077b6;
    color: white;
}
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html" class="active">HOME</a>
        <a href="events.html">EVENTS</a>
        <a href="societies.html">SOCIETIES</a>
        <a href="execom.html">EXECOM</a>
        <a href="signin.html">SIGN IN</a>
    </div>
    <div class="modal-card">
        <!-- Close button 'X' -->
        <button class="close-btn">&times;</button>

        <!-- Top visual accent element -->
        <div class="top-graphic">
            <div class="pixel-face"></div>
        </div>

        <!-- Heading Titles -->
        <h2 class="modal-header">SIGN IN</h2>
        <div class="header-line"></div>
        <p class="modal-description">Sign in to access society management and event tools.</p>

        <!-- Google OAuth Authentication Button -->
         
        <button class="btn btn-google" onclick="window.location.href='continue with google.html';">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>
        

        <!-- WebAuthn Passkeys Alternative Button -->
        <button class="btn btn-passkey" onclick="window.location.href='login to passkey.html';">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Login with passkeys
        </button>

        <!-- Branding Footer Segment -->
        <div class="footer-divider">IEEE KIDANGOOR</div>
        <p class="footer-note">Secured with OAuth 2.0 / Passkeys</p>
        </div>
</body>
</html>
